<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sift (E2E fixture)</title>
    <script>
      // The fixture renders relative timestamps and row dates; pin the clock so
      // list order, formatted dates, screenshots and *scheduled deadlines* are
      // reproducible. Production code reads "now" through both `Date.now()` and
      // `new Date()`, so pinning only one of the two would let the app compute a
      // different present than the fixture's clock; the suite moves this single
      // value to cross a due time (P8.1/P8.2).
      (function () {
        var FIXED = 1768478400000; // 2026-01-15T12:00:00Z, matches dataset.ts
        window.__SIFT_CLOCK__ = { now: FIXED };
        class FixtureDate extends Date {
          constructor(...args) {
            if (args.length === 0) super(window.__SIFT_CLOCK__.now);
            else super(...args);
          }
          static now() {
            return window.__SIFT_CLOCK__.now;
          }
        }
        window.Date = FixtureDate;
        window.__SIFT_E2E__ = true;
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
