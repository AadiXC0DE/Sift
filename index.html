<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sift</title>
    <script>
      // Paint the correct background before any stylesheet loads, so a dark
      // Mac never gets a white flash on launch.
      try {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fafaf9;
      }
      html[data-theme='dark'] body {
        background: #1b1b1a;
      }
      #sift-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        z-index: 9999;
        transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #sift-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #sift-splash .mark {
        width: 62px;
        height: 62px;
        border-radius: 15px;
        background: #2456e0;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 800 36px/1 -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        animation: sift-pulse 1.7s ease-in-out infinite;
      }
      @keyframes sift-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.96);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sift-splash .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="sift-splash" aria-hidden="true"><div class="mark">S</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
