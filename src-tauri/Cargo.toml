[package]
name = "sift"
version = "1.0.0"
description = "Sift — fast, quiet email for Gmail"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
keyring = "3"
oauth2 = "5"
mail-parser = "0.9"
mail-builder = "0.3"
ammonia = "4"
zstd = "0.13"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
governor = "0.6"
log = "0.4"
url = "2"
futures = "0.3"
async-trait = "0.1"
async-compression = { version = "0.4", features = ["tokio", "deflate"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-platform-verifier = "0.7"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "pool", "hostname"] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
[dev-dependencies]
imap-proto = "0.16"
wiremock = "0.6"
tempfile = "3"
insta = { version = "1", features = ["json"] }
tokio-util = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "threads_query"
harness = false
[[bench]]
name = "search"
harness = false

[features]
default = []
demo = []
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"
