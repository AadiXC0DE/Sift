name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v1.1.0
      artifact_run_id:
        description: Verified release run whose universal installers should be recovered
        required: true
        default: '34844819611'
permissions:
  contents: write
  actions: read
jobs:
  build-release:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: verify both Rust targets before compiling
        run: |
          rustup target list --installed | grep -Fx aarch64-apple-darwin
          rustup target list --installed | grep -Fx x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      # Every gate below fails the job; nothing is masked with `|| true`.
      - name: versions agree (package.json, Cargo.toml, tauri.conf.json, CHANGELOG)
        run: pnpm exec tsx scripts/check-versions.ts --tag "${{ env.RELEASE_TAG }}"
      - run: pnpm build
      - name: verify email rendering under the packaged security policy
        run: |
          pnpm exec playwright install chromium
          pnpm e2e:bundle
          PW_PREVIEW=1 PW_PROJECTS=chromium pnpm e2e e2e/release-csp.spec.ts
      - name: build unnotarized universal app (signed updater artifacts)
        if: github.event_name != 'workflow_dispatch'
        run: pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIFT_GOOGLE_CLIENT_ID: ${{ secrets.SIFT_GOOGLE_CLIENT_ID }}
          SIFT_GOOGLE_CLIENT_SECRET: ${{ secrets.SIFT_GOOGLE_CLIENT_SECRET }}
      - name: validate recovery source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          gh run view "$RUN_ID" --json workflowName,headBranch --jq '.workflowName + " " + .headBranch' > /tmp/recovery-source
          test "$(cat /tmp/recovery-source)" = "release $RELEASE_TAG"
          SOURCE_SHA=$(gh run view "$RUN_ID" --json headSha --jq .headSha)
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$SOURCE_SHA" = "$TAG_SHA"
      - name: recover retained installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: universal-installers
          path: src-tauri/target/universal-apple-darwin/release/bundle
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: extract app for signature and architecture checks
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          tar -xzf Sift.app.tar.gz
      - name: retain built installers for artifact verification
        uses: actions/upload-artifact@v4
        with:
          name: universal-installers
          retention-days: 7
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
      - name: bundle budget on the universal artifact (DMG <=20 MiB, eager JS <=250 KiB gzip)
        run: |
          bash scripts/check-bundle.sh \
            --target-dir src-tauri/target/universal-apple-darwin/release \
            --require-artifacts --max-js-kib 250 --max-dmg-mib 20
      - name: ad-hoc signature and artifact gate (Apple notarization deferred)
        run: |
          bash scripts/verify-release.sh --mode unnotarized \
            --bundle-dir src-tauri/target/universal-apple-darwin/release/bundle
      # Fails while tauri.conf.json still holds the placeholder updater key.
      - name: generate latest.json and SHA256SUMS
        run: |
          pnpm exec tsx scripts/release-metadata.ts \
            --bundle-dir src-tauri/target/universal-apple-darwin/release/bundle \
            --out-dir release-assets \
            --repo "${{ github.repository }}" --tag "${{ env.RELEASE_TAG }}"
      - name: verify staged metadata against the staged bytes
        run: |
          pnpm exec tsx scripts/release-metadata.ts --verify release-assets \
            --repo "${{ github.repository }}" --tag "${{ env.RELEASE_TAG }}"
      - name: updater failure modes (staged fixture endpoint)
        run: pnpm exec tsx scripts/updater-dryrun.ts
      - name: previous release still carries a rollback installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/verify-release.sh --rollback-check \
            --repo "${{ github.repository }}" --tag "${{ env.RELEASE_TAG }}"
      # Draft until every gate above passed; nothing is public yet.
      - name: create draft release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            This Sift build is an unnotarized macOS release. Apple Developer ID signing and notarization are not included. First-launch steps, including when Open Anyway is missing: https://usesift.xyz/download#first-launch
            The updater archive is cryptographically signed with Sift's updater key.
          files: release-assets/*
      - name: verify uploaded bytes, checksums and urls while still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec tsx scripts/release-metadata.ts --verify-remote \
            --out-dir release-assets \
            --repo "${{ github.repository }}" --tag "${{ env.RELEASE_TAG }}"
      - name: publish (un-draft) only after every gate passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --draft=false
      # The site is a separate Vercel project and Vercel only rebuilds on
      # branch pushes, so a release tag does not redeploy it. A Deploy Hook is
      # the supported trigger: the maintainer creates one in the project
      # (Settings -> Git -> Deploy Hooks) and stores its URL as
      # VERCEL_DEPLOY_HOOK_URL. This runs last, after the release is published,
      # so the site is built from a release that exists.
      - name: rebuild the site (Vercel deploy hook)
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          else
            echo "Site deploy hook not configured; deploy the site separately."
          fi
