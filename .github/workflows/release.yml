name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin,x86_64-apple-darwin }
      - run: pnpm install --frozen-lockfile
      # Every gate below fails the job; nothing is masked with `|| true`.
      - name: versions agree (package.json, Cargo.toml, tauri.conf.json, CHANGELOG)
        run: pnpm exec tsx scripts/check-versions.ts --tag "${{ github.ref_name }}"
      - run: pnpm build
      - name: build unnotarized universal app (signed updater artifacts)
        run: pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIFT_GOOGLE_CLIENT_ID: ${{ secrets.SIFT_GOOGLE_CLIENT_ID }}
          SIFT_GOOGLE_CLIENT_SECRET: ${{ secrets.SIFT_GOOGLE_CLIENT_SECRET }}
      - name: bundle budget on the universal artifact (DMG <=12 MiB, eager JS <=250 KiB gzip)
        run: |
          bash scripts/check-bundle.sh \
            --target-dir src-tauri/target/universal-apple-darwin/release \
            --require-artifacts --max-js-kib 250 --max-dmg-mib 12
      - name: ad-hoc signature and artifact gate (Apple notarization deferred)
        run: |
          bash scripts/verify-release.sh --mode unnotarized \
            --bundle-dir src-tauri/target/universal-apple-darwin/release/bundle
      # Fails while tauri.conf.json still holds the placeholder updater key.
      - name: generate latest.json and SHA256SUMS
        run: |
          pnpm exec tsx scripts/release-metadata.ts \
            --bundle-dir src-tauri/target/universal-apple-darwin/release/bundle \
            --out-dir release-assets \
            --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"
      - name: verify staged metadata against the staged bytes
        run: |
          pnpm exec tsx scripts/release-metadata.ts --verify release-assets \
            --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"
      - name: updater failure modes (staged fixture endpoint)
        run: pnpm exec tsx scripts/updater-dryrun.ts
      - name: previous release still carries a rollback installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/verify-release.sh --rollback-check \
            --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"
      # Draft until every gate above passed; nothing is public yet.
      - name: create draft release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Sift 1.1.0 is an unnotarized macOS release. Apple Developer ID signing and notarization are not included. If macOS blocks opening it, use System Settings → Privacy & Security → Open Anyway after verifying SHA256SUMS.
            The updater archive is cryptographically signed with Sift's updater key.
          files: release-assets/*
      - name: verify uploaded bytes, checksums and urls while still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec tsx scripts/release-metadata.ts --verify-remote \
            --out-dir release-assets \
            --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"
      - name: publish (un-draft) only after every gate passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
      # The site is a separate Vercel project and Vercel only rebuilds on
      # branch pushes, so a release tag does not redeploy it. A Deploy Hook is
      # the supported trigger: the maintainer creates one in the project
      # (Settings -> Git -> Deploy Hooks) and stores its URL as
      # VERCEL_DEPLOY_HOOK_URL. This runs last, after the release is published,
      # so the site is built from a release that exists.
      - name: rebuild the site (Vercel deploy hook)
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          else
            echo "Site deploy hook not configured; deploy the site separately."
          fi
